<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TBSC — FRP Boat Quotation System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="styles.css?v=20261024b">
<script>
/* If a script error ever stops the app from starting, say so on the loading screen instead of spinning forever. */
window.addEventListener('error', function(e){
  var b = document.getElementById('bootScreen'); if(!b) return;
  var m = b.querySelector('.msg'), sp = b.querySelector('.spin');
  if(sp) sp.style.display = 'none';
  if(m) m.textContent = 'Startup error: ' + (e.message||'unknown') + ' (' + String(e.filename||'').split('/').pop() + ':' + (e.lineno||'?') + ')';
});
</script>


</head>

<body>
<div id="app">

  <!-- Floating dock: quick actions (wired up at the bottom of app.js) -->
  <aside class="sidebar" aria-label="Quick actions">
    <button class="dock-btn primary" data-dock="new" title="New quotation" aria-label="New quotation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="dock-btn" data-dock="search" title="Search quotations" aria-label="Search quotations">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="dock-btn" data-dock="customers" title="Customers" aria-label="Customers">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
    <button class="dock-btn" data-dock="templates" title="Presets" aria-label="Presets">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21c1.6 1.2 3.5 1.2 5 0 1.6 1.2 3.5 1.2 5 0 1.6 1.2 3.5 1.2 5 0"/><path d="M4 17l1-8h6l1 8"/><path d="M11 9V4h3l3 5"/></svg>
    </button>
    <button class="dock-btn" data-dock="pricing" title="Pricing database" aria-label="Pricing database">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
    </button>
    <div class="dock-sep"></div>
    <button class="dock-btn" data-dock="settings" title="Settings" aria-label="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="mark">
          <div class="brand-tile">
            <svg width="22" height="22" viewBox="0 0 26 26"><path d="M3 17c2 3 5 3 7 1 2 2 5 2 7 0 2 2 5 2 7-1" stroke="#f2c230" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M6 14l2-9h9l2 9" stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <h1>TBSC</h1>
            <div class="sub">FRP quotations</div>
          </div>
        </div>
      </div>
      <nav class="nav" id="navList" aria-label="Main"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </header>

    <div class="main">
      <div class="topbar">
        <div class="title">
          <button class="menu-btn" id="menuBtn" aria-label="Toggle menu" tabindex="-1"></button>
          <span id="topbarTitle">Dashboard</span>
        </div>
        <div class="actions" id="topbarActions"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<div id="loginScreen">
  <form id="loginForm">
    <div class="brand-tile">
      <svg width="24" height="24" viewBox="0 0 26 26"><path d="M3 17c2 3 5 3 7 1 2 2 5 2 7 0 2 2 5 2 7-1" stroke="#f2c230" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M6 14l2-9h9l2 9" stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
    </div>
    <h1>TBSC Quotation System</h1>
    <div class="login-sub">Sign in with your team account to continue.</div>
    <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username" required></div>
    <div class="field"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
    <div id="loginError"></div>
    <button type="submit" class="btn btn-primary" id="loginSubmit">Sign in</button>
  </form>
</div>

<div id="bootScreen">
  <div class="spin"></div>
  <div class="msg">Loading quotation system…</div>
</div>

<script src="sales.js?v=20261019h"></script>
<script src="app.js?v=20261026b"></script>


</body>
</html>
